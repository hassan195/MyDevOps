name: deploy workflow for Week 5-2deploy

on:
    workflow_call:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                type: string
        secrets:
            AWS_ROLE_ARN:
                description: 'AWS role ARN to assume via OIDC'
                required: true
permissions:
    contents: read
    id-token: write

env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: week5-2-deploy
    TAG: ${{ inputs.environment }}
    GIT_SHA: ${{ github.sha }} 

jobs:
    build-push:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: ./task/week5-2
        environment: ${{ inputs.environment }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4


            - name: Authenticate to AWS via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Write .env
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
              run: |
                  echo "DOCKER_IMAGE_NAME=${ECR_REGISTRY}/${{env.ECR_REPOSITORY}}" >> .env
        
            - name: Build
              run: make build

            - name: Push
              run: make push 

            - name: Deploy to EC2 via SSM
              env:
                INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
                CONTAINER_NAME: week5-2-deploy
              run: |
                  ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                  REGISTRY_URI=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
                  IMAGE=${REGISTRY_URI}/${{ env.ECR_REPOSITORY }}:${TAG}

                  CMD_ID=$(aws ssm send-command \
                      --targets "Key=instanceIds,Values=${INSTANCE_ID}" \
                      --document-name "AWS-RunShellScript" \
                      --comment "Deploying  ${IMAGE} (${GIT_SHA::7}) application" \
                      --region ${{ env.AWS_REGION }} \
                      --parameters commands="[
                        \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY_URI}\",
                        \"docker pull ${IMAGE}\",
                        \"docker rm -f ${CONTAINER_NAME} || true\",
                        \"docker run -d --name ${CONTAINER_NAME} --restart unless-stopped -p 8080:8080 ${IMAGE}\"
                        ]" \
                        --query "Command.CommandId" --output text)

                        if ! aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
                            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}'
                            exit 1
                        fi      
