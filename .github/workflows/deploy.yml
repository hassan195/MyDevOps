name: deploy workflow for Week 5-2deploy

on:
    workflow_call:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                type: string
        secrets:
            AWS_ROLE_ARN:
                description: 'AWS role ARN to assume via OIDC'
                required: true
permissions:
    contents: read
    id-token: write

env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: week5-2-deploy

jobs:
    build-push:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Authenticate to AWS via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Write .env
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
              run: |
                  echo "DOCKER_IMAGE_NAME=${ECR_REGISTRY}/${{env.ECR_REPOSITORY}}" >> .env
                  echo "TAG=${GITHUB_SHA}" >> .env

            - name: Build
              run: make build

            - name: Push
              run: make push 


